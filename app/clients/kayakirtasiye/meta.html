<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />

  <style>
    {{CSS}}
  </style>
</head>

<body>

<div class="frame">

  <div class="canvas">

    <div class="dot-pattern top-right"></div>
    <div class="dot-pattern bottom-left"></div>


    <!-- LOGO -->

    <div class="logo-area">

      <img
        class="logo"
        src="{{logo_url}}"
        alt=""
      />

    </div>


    <!-- LEFT CONTENT -->

    <div class="left-content">

      <div class="brand-line"></div>


      <!-- TITLE -->

      <div class="title-area" id="titleArea">

        <div
          class="product-title"
          id="productTitle"
        >{{title}}</div>

      </div>


      <div class="content-divider"></div>


      <!-- PRICE -->

      <div class="price-area">

        <div
          class="product-price"
          id="productPrice"
        >{{price}}</div>

      </div>


      <!-- SHIPPING -->

      <div class="shipping-card">

        <div class="shipping-icon">

          <div class="truck-body"></div>
          <div class="truck-cabin"></div>

          <div class="truck-wheel one"></div>
          <div class="truck-wheel two"></div>

        </div>


        <div class="shipping-text">

          <div class="shipping-main">
            900 TL VE ÜZERİ
          </div>

          <div class="shipping-sub">
            KARGO BEDAVA
          </div>

        </div>

      </div>

    </div>


    <!-- PRODUCT -->

    <div class="product-area">

      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <div class="footer-line"></div>

    <div>
      kayakirtasiye.com.tr
    </div>

    <div class="footer-line"></div>

  </div>

</div>


<script>

/* ==================================================
   TITLE FIT

   1. Tam başlığı dene
   2. 40px -> 32px küçült
   3. Hâlâ taşarsa kelime bazlı ...
   4. Gerçek 2 satır kullanılır
================================================== */

function getTitleMaxHeight(el) {

  const style =
    window.getComputedStyle(el);

  const lineHeight =
    parseFloat(style.lineHeight);

  return (lineHeight * 2) + 4;

}


function titleFits(el) {

  return (
    el.scrollHeight <= getTitleMaxHeight(el) &&
    el.scrollHeight <= 118
  );

}


function fitTitle() {

  const el =
    document.getElementById("productTitle");

  if (!el) return;


  const original =
    el.textContent
      .replace(/\s+/g, " ")
      .trim();


  let fontSize = 40;
  const minFontSize = 32;


  el.textContent = original;
  el.style.fontSize = fontSize + "px";


  /* -------------------------
     FIRST:
     KEEP FULL TITLE
  ------------------------- */

  while (
    fontSize > minFontSize &&
    !titleFits(el)
  ) {

    fontSize--;

    el.style.fontSize =
      fontSize + "px";

  }


  /* Full title fits */

  if (titleFits(el)) {
    return;
  }


  /* -------------------------
     STILL TOO LONG:
     WORD BASED ELLIPSIS
  ------------------------- */

  const words =
    original.split(" ");


  let low = 1;
  let high = words.length;

  let best =
    words[0] + "...";


  while (low <= high) {

    const mid =
      Math.floor(
        (low + high) / 2
      );


    const candidate =
      words
        .slice(0, mid)
        .join(" ") + "...";


    el.textContent =
      candidate;


    if (titleFits(el)) {

      best = candidate;

      low = mid + 1;

    } else {

      high = mid - 1;

    }

  }


  el.textContent = best;

}


/* ==================================================
   PRICE FIT

   FİYAT DEĞERİNE DOKUNMAZ.
   SADECE FONT KÜÇÜLÜR.
================================================== */

function fitPrice() {

  const el =
    document.getElementById("productPrice");

  if (!el) return;


  let fontSize = 92;

  const minFontSize = 50;
  const maxWidth = 400;


  el.style.fontSize =
    fontSize + "px";


  while (
    el.scrollWidth > maxWidth &&
    fontSize > minFontSize
  ) {

    fontSize--;

    el.style.fontSize =
      fontSize + "px";

  }

}


/* ==================================================
   PREPARE
================================================== */

async function prepareFrame() {

  try {

    if (
      document.fonts &&
      document.fonts.ready
    ) {

      await document.fonts.ready;

    }

  } catch (e) {}


  fitTitle();
  fitPrice();

}


prepareFrame();

</script>

</body>

</html>
