<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />

  <style>
    {{CSS}}
  </style>
</head>

<body>

<div class="frame">

  <div class="canvas">

    <!-- DECOR -->

    <div class="dot-pattern top-right"></div>
    <div class="dot-pattern bottom-left"></div>


    <!-- LOGO -->

    <div class="logo-area">

      <img
        class="logo"
        src="{{logo_url}}"
        alt=""
      />

    </div>


    <!-- LEFT CONTENT -->

    <div class="left-content">

      <div class="brand-line"></div>


      <!-- PRODUCT TITLE -->

      <div class="title-area">

        <div
          class="product-title"
          id="productTitle"
        >{{title}}</div>

      </div>


      <div class="content-divider"></div>


      <!-- PRICE -->

      <div class="price-area">

        <div
          class="product-price"
          id="productPrice"
        >{{price}}</div>

      </div>


      <!-- SHIPPING -->

      <div class="shipping-card">

        <div class="shipping-icon">

          <div class="truck-body"></div>
          <div class="truck-cabin"></div>

          <div class="truck-wheel one"></div>
          <div class="truck-wheel two"></div>

        </div>


        <div class="shipping-text">

          <div class="shipping-main">
            900 TL VE ÜZERİ
          </div>

          <div class="shipping-sub">
            KARGO BEDAVA
          </div>

        </div>

      </div>

    </div>


    <!-- PRODUCT -->

    <div class="product-area">

      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <div class="footer-line"></div>

    <div>
      kayakirtasiye.com.tr
    </div>

    <div class="footer-line"></div>

  </div>

</div>


<script>

/* ==================================================
   TITLE
   Önce küçült.
   Hâlâ sığmıyorsa kelime bazlı ...
================================================== */

function titleFits(el) {

  const style = window.getComputedStyle(el);

  const lineHeight = parseFloat(style.lineHeight);

  const maxHeight = (lineHeight * 2) + 7;

  return el.scrollHeight <= maxHeight;
}


function fitTitle() {

  const el = document.getElementById("productTitle");

  if (!el) return;

  const original =
    el.textContent
      .replace(/\s+/g, " ")
      .trim();

  el.textContent = original;

  let size = 40;
  const minSize = 31;

  el.style.fontSize = size + "px";


  /* Önce tam başlığı koru */

  while (
    size > minSize &&
    !titleFits(el)
  ) {

    size--;

    el.style.fontSize = size + "px";

  }


  /* Minimum boyutta hâlâ taşarsa
     kelime bazlı kısalt */

  if (!titleFits(el)) {

    const words = original.split(" ");

    let low = 1;
    let high = words.length;

    let best = words[0] + "...";

    while (low <= high) {

      const mid =
        Math.floor((low + high) / 2);

      const candidate =
        words
          .slice(0, mid)
          .join(" ") + "...";

      el.textContent = candidate;

      if (titleFits(el)) {

        best = candidate;
        low = mid + 1;

      } else {

        high = mid - 1;

      }

    }

    el.textContent = best;

  }

}


/* ==================================================
   PRICE
   İçeriğe kesinlikle dokunma.
   Yalnızca font size küçült.
================================================== */

function fitPrice() {

  const el =
    document.getElementById("productPrice");

  if (!el) return;

  let size = 92;
  const minSize = 50;

  const maxWidth = 385;

  el.style.fontSize = size + "px";

  while (
    el.scrollWidth > maxWidth &&
    size > minSize
  ) {

    size--;

    el.style.fontSize = size + "px";

  }

}


/* ==================================================
   WAIT FOR OUTFIT
================================================== */

async function prepareFrame() {

  try {

    if (
      document.fonts &&
      document.fonts.ready
    ) {

      await document.fonts.ready;

    }

  } catch (e) {}

  fitTitle();
  fitPrice();

}

prepareFrame();

</script>

</body>

</html>
