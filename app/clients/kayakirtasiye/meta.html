<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <style>
    {{CSS}}
  </style>
</head>

<body>

<div class="frame">

  <div class="canvas">

    <!--
      Dekoratif alanlar.
      Crop olması tasarımın anlamını bozmaz.
    -->
    <div class="corner top-left"></div>
    <div class="corner bottom-right"></div>

    <div class="dots top-right"></div>
    <div class="dots bottom-left"></div>


    <!-- LOGO -->

    <div class="logo-area">
      <img
        class="logo"
        src="{{logo_url}}"
        alt=""
      />
    </div>


    <!-- ÜRÜN -->

    <div class="product-area">
      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />
    </div>


    <!-- ÜRÜN ADI -->

    <div class="title-area">
      <div
        class="product-title"
        id="productTitle"
      >{{title}}</div>
    </div>

    <div class="title-divider"></div>


    <!-- AVANTAJLAR -->

    <div class="benefits">

      <!-- KARGO -->

      <div class="benefit shipping">

        <div class="benefit-icon">

          <div class="truck-body"></div>
          <div class="truck-cabin"></div>

          <div class="truck-wheel one"></div>
          <div class="truck-wheel two"></div>

        </div>

        <div class="benefit-text">

          <div class="benefit-top">
            900 TL VE ÜZERİ
          </div>

          <div class="benefit-bottom">
            KARGO BEDAVA
          </div>

        </div>

      </div>


      <div class="benefit-separator"></div>


      <!-- GÜVEN -->

      <div class="benefit trust">

        <div class="benefit-icon">
          <div class="shield"></div>
        </div>

        <div class="benefit-text">

          <div class="benefit-top">
            GÜVENLİ
          </div>

          <div class="benefit-bottom">
            ALIŞVERİŞ
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <div class="footer-line"></div>

    <div>
      kayakirtasiye.com.tr
    </div>

    <div class="footer-line"></div>

  </div>

</div>


<script>

/*
  Başlık:
  - maksimum 2 satır
  - önce font küçülür
  - hâlâ sığmıyorsa kelime kelime kısalır
  - "..." EKLENMEZ
*/

function titleFits(el) {

  const styles = window.getComputedStyle(el);

  const fontSize =
    parseFloat(styles.fontSize);

  const lineHeight =
    parseFloat(styles.lineHeight);

  const maxHeight =
    lineHeight * 2 + 2;

  return el.scrollHeight <= maxHeight;
}


function fitTitle() {

  const el =
    document.getElementById("productTitle");

  if (!el) return;


  const original =
    el.textContent
      .replace(/\s+/g, " ")
      .trim();


  el.textContent = original;


  let fontSize = 39;

  const minFontSize = 31;


  el.style.fontSize =
    fontSize + "px";


  /*
    Önce font küçült.
  */

  while (
    !titleFits(el) &&
    fontSize > minFontSize
  ) {

    fontSize--;

    el.style.fontSize =
      fontSize + "px";
  }


  /*
    Minimum fontta bile
    iki satırı geçiyorsa
    kelimeleri azalt.

    Ellipsis YOK.
  */

  if (!titleFits(el)) {

    const words =
      original.split(" ");


    let low = 1;

    let high =
      words.length;

    let best = "";


    while (low <= high) {

      const middle =
        Math.floor(
          (low + high) / 2
        );


      const candidate =
        words
          .slice(0, middle)
          .join(" ");


      el.textContent =
        candidate;


      if (titleFits(el)) {

        best =
          candidate;

        low =
          middle + 1;

      } else {

        high =
          middle - 1;

      }

    }


    el.textContent =
      best;

  }

}


async function prepareFrame() {

  try {

    if (
      document.fonts &&
      document.fonts.ready
    ) {

      await document.fonts.ready;

    }

  } catch (e) {}


  fitTitle();

}


prepareFrame();

</script>

</body>
</html>
