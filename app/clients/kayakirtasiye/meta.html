<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />

  <style>
    {{CSS}}
  </style>
</head>

<body>

<div class="frame">

  <div class="canvas">

    <!-- DECOR -->

    <div class="dot-pattern top-right"></div>
    <div class="dot-pattern bottom-left"></div>


    <!-- LOGO -->

    <div class="logo-area">

      <img
        class="logo"
        src="{{logo_url}}"
        alt=""
      />

    </div>


    <!-- PRODUCT -->

    <div class="product-area">

      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />

    </div>


    <!-- PRODUCT TITLE -->

    <div class="title-area">

      <div
        class="product-title"
        id="productTitle"
      >
        {{title}}
      </div>

    </div>


    <!-- DIVIDER -->

    <div class="title-divider"></div>


    <!-- SHIPPING -->

    <div class="shipping-card">

      <div class="shipping-icon">

        <div class="truck-body"></div>

        <div class="truck-cabin"></div>

        <div class="truck-wheel one"></div>

        <div class="truck-wheel two"></div>

      </div>


      <div class="shipping-text">

        <div class="shipping-main">
          900 TL VE ÜZERİ
        </div>

        <div class="shipping-sub">
          KARGO BEDAVA
        </div>

      </div>

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <div class="footer-line"></div>

    <div>
      kayakirtasiye.com.tr
    </div>

    <div class="footer-line"></div>

  </div>

</div>


<script>

/* ==================================================
   TITLE FIT
   MAXIMUM 2 LINES
   NO "..."
================================================== */

function fitTitle() {

  const el =
    document.getElementById("productTitle");

  if (!el) return;


  const original =
    el.textContent
      .replace(/\s+/g, " ")
      .trim();


  el.textContent = original;


  let fontSize = 37;

  const minFontSize = 31;


  el.style.fontSize =
    fontSize + "px";


  while (
    el.scrollHeight > 90 &&
    fontSize > minFontSize
  ) {

    fontSize--;

    el.style.fontSize =
      fontSize + "px";

  }

}


/* ==================================================
   PREPARE
================================================== */

async function prepareFrame() {

  try {

    if (
      document.fonts &&
      document.fonts.ready
    ) {

      await document.fonts.ready;

    }

  } catch (e) {}


  fitTitle();

}


prepareFrame();

</script>

</body>

</html>
