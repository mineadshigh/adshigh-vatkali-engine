<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />

  <style>
    {{CSS}}
  </style>
</head>

<body>

<div class="frame">

  <div class="canvas">

    <!-- BACKGROUND DECOR -->

    <div class="product-circle-main"></div>
    <div class="product-circle-inner"></div>

    <div class="dot-pattern top-right"></div>
    <div class="dot-pattern bottom-left"></div>


    <!-- LEFT SIDE -->

    <div class="left-column">

      <!-- LOGO -->

      <div class="logo-area">
        <img
          class="logo"
          src="{{logo_url}}"
          alt=""
        />
      </div>


      <!-- SHORT RED LINE -->

      <div class="brand-line"></div>


      <!-- TITLE -->

      <div class="title-area">

        <div
          class="product-title"
          id="productTitle"
        >{{title}}</div>

      </div>


      <!-- PRICE -->

      <div class="price-area">

        <div
          class="product-price"
          id="productPrice"
        >{{price}}</div>

      </div>


      <!-- SHIPPING -->

      <div class="shipping-card">

        <div class="shipping-icon">

          <div class="truck-body"></div>
          <div class="truck-cabin"></div>

          <div class="truck-wheel one"></div>
          <div class="truck-wheel two"></div>

        </div>


        <div class="shipping-text">

          <div class="shipping-main">
            900 TL VE ÜZERİ
          </div>

          <div class="shipping-sub">
            KARGO BEDAVA
          </div>

        </div>

      </div>

    </div>


    <!-- PRODUCT -->

    <div class="product-area">

      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <div class="footer-line"></div>

    <div>
      kayakirtasiye.com.tr
    </div>

    <div class="footer-line"></div>

  </div>

</div>


<script>

/* ==================================================
   PRICE FITTING
   Fiyatın içeriğine dokunmaz.
   Yalnızca çok uzun fiyatlarda fontu küçültür.
================================================== */

function fitPrice() {

  const el =
    document.getElementById("productPrice");

  if (!el) return;

  let size = 86;
  const minSize = 54;
  const maxWidth = 430;

  el.style.fontSize =
    size + "px";

  while (
    el.scrollWidth > maxWidth &&
    size > minSize
  ) {

    size--;

    el.style.fontSize =
      size + "px";

  }

}


/* ==================================================
   WAIT FOR OUTFIT
================================================== */

async function prepareFrame() {

  try {

    if (
      document.fonts &&
      document.fonts.ready
    ) {
      await document.fonts.ready;
    }

  } catch (e) {}

  fitPrice();
}

prepareFrame();

</script>

</body>

</html>
