<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />

  <style>
    {{CSS}}
  </style>
</head>

<body>

<div class="frame">

  <div class="canvas">

    <!-- DECOR -->

    <div class="dot-pattern top-right"></div>
    <div class="dot-pattern bottom-left"></div>


    <!-- LOGO -->

    <div class="logo-area">

      <img
        class="logo"
        src="{{logo_url}}"
        alt=""
      />

    </div>


    <!-- LEFT CONTENT -->

    <div class="left-content">

      <!-- RED LINE -->

      <div class="brand-line"></div>


      <!-- PRODUCT TITLE -->

      <div class="title-area">

        <div class="product-title">
          {{title}}
        </div>

      </div>


      <!-- DIVIDER -->

      <div class="content-divider"></div>


      <!-- PRICE -->

      <div class="price-area">

        <div
          class="product-price"
          id="productPrice"
        >
          {{price}}
        </div>

      </div>


      <!-- SHIPPING CTA -->

      <div class="shipping-card">

        <div class="shipping-icon">

          <div class="truck-body"></div>

          <div class="truck-cabin"></div>

          <div class="truck-wheel one"></div>

          <div class="truck-wheel two"></div>

        </div>


        <div class="shipping-text">

          <div class="shipping-main">
            900 TL VE ÜZERİ
          </div>

          <div class="shipping-sub">
            KARGO BEDAVA
          </div>

        </div>

      </div>

    </div>


    <!-- PRODUCT IMAGE -->

    <div class="product-area">

      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    <div class="footer-line"></div>

    <div>
      kayakirtasiye.com.tr
    </div>

    <div class="footer-line"></div>

  </div>

</div>


<script>

/* ==================================================
   PRICE FITTING

   PRICE VALUE IS NEVER CHANGED.
   ONLY FONT SIZE IS REDUCED IF NECESSARY.
================================================== */

function fitPrice() {

  const el =
    document.getElementById("productPrice");

  if (!el) return;


  let fontSize = 92;

  const minFontSize = 50;
  const maxWidth = 400;


  el.style.fontSize =
    fontSize + "px";


  while (
    el.scrollWidth > maxWidth &&
    fontSize > minFontSize
  ) {

    fontSize--;

    el.style.fontSize =
      fontSize + "px";

  }

}


/* ==================================================
   WAIT FOR FONT
================================================== */

async function prepareFrame() {

  try {

    if (
      document.fonts &&
      document.fonts.ready
    ) {

      await document.fonts.ready;

    }

  } catch (e) {}


  fitPrice();

}


prepareFrame();

</script>

</body>

</html>
