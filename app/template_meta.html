<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <style>{{CSS}}</style>
</head>

<body>
  <div class="frame">

    <div class="product-frame">
      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />
    </div>

    <section class="campaign-panel">

      <div class="campaign-title">İNDİRİM</div>

      <div class="discount-row">

        <div class="discount-offer offer-20">
          <div class="discount-label">2 ÜRÜN VE ÜZERİ</div>
          <div class="discount-value">20%</div>
        </div>

        <div class="discount-divider"></div>

        <div class="discount-offer offer-30">
          <div class="discount-label">3 ÜRÜN VE ÜZERİ</div>
          <div class="discount-value">30%</div>
        </div>

      </div>

      <div class="extra-offer">
        <div class="extra-title">TÜM İNDİRİMLERE EK</div>
        <div class="extra-value">+10%</div>
        <div class="coupon-label">KUPON KODU</div>

        <div class="coupon-code">
          JULY10
        </div>
      </div>

    </section>

  </div>
</body>
</html>
