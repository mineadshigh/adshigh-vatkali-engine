<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame">
    <div class="product-frame"><img src="{{product_image_primary}}" alt="" /></div>
    <section class="campaign">
      <h1 class="campaign-title">SONBAHAR İNDİRİMİ</h1>
      <div class="discount">
        <div class="discount-kicker">TÜM ÜRÜNLERDE</div>
        <div class="discount-value"><span class="percent">%</span>40</div>
        <div class="discount-suffix">’A VARAN</div>
        <div class="discount-label">İNDİRİM</div>
      </div>
    </section>
    <section class="product-info">
      <p class="product-title">{{title}}</p>
      <div class="prices">
        <span class="old-price {{old_hidden}}">{{price}}</span>
        <span class="sale-price {{new_hidden}}">{{sale_price}}</span>
        <span class="single-price {{single_hidden}}">{{price}}</span>
      </div>
    </section>
    <img class="logo" src="{{logo_url}}" alt="VATKALI" />
  </main>
</body>
</html>
