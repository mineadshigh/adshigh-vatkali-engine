<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame">
    <div class="standard-design">
      <div class="product-frame standard-product-frame">
        <img class="product-image" src="{{product_image_primary}}" alt="" />
      </div>
      <section class="campaign-panel">
        <h1 class="campaign-title">SEZONUN SON<br />İNDİRİMİ</h1>
        <p class="campaign-offer">SEPETTE EKSTRA NET <strong>%40</strong></p>
        <div class="product-info">
          <p class="product-title">{{title}}</p>
          <div class="prices">
            <span class="old-price {{old_hidden}}">{{price}}</span>
            <span class="sale-price {{new_hidden}}">{{sale_price}}</span>
            <span class="single-price {{single_hidden}}">{{price}}</span>
          </div>
        </div>
        <div class="campaign-logo"><img src="{{logo_url}}" alt="VATKALI" /></div>
      </section>
    </div>

    <div class="attitude-design">
      <div class="attitude-product-frame">
        <img class="product-image" src="{{product_image_primary}}" alt="" />
      </div>
      <div class="attitude-new">NEW</div>
      <div class="attitude-name">THE ATTITUDE</div>
      <div class="attitude-season">26/27’FW</div>
      <div class="attitude-offer">LANSMANA ÖZEL <strong>%10 OFF</strong></div>
      <div class="attitude-logo"><img src="{{logo_url}}" alt="VATKALI" /></div>
    </div>
