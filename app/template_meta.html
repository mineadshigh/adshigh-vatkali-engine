<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame {{variant_class}}">
    <section class="discount-20-design">
      <div class="d20-product"><img src="{{product_image_primary}}" alt="" /></div>
      <h1 class="d20-name">THE ATTITUDE</h1>
      <p class="d20-offer">YENİ SEZON ÜRÜNLERDE<br /><strong>NET %20 İNDİRİM</strong></p>
      <p class="d20-date">*Kampanya 15.10.2026 tarihine<br />kadar geçerlidir.</p>
      <img class="d20-logo" src="{{logo_url}}" alt="VATKALI" />
    </section>

    <section class="discount-40-design">
      <div class="d40-product"><img src="{{product_image_primary}}" alt="" /></div>
      <h1 class="d40-name">BEST SELLER OFF</h1>
      <p class="d40-offer">ÇOK SATAN PARÇALARDA<br /><strong>NET %40 İNDİRİM</strong></p>
      <div class="d40-info">
        <p class="d40-title">{{title}}</p>
        <div class="d40-prices">
          <span class="old-price {{old_hidden}}">{{price}}</span>
          <span class="sale-price {{new_hidden}}">{{sale_price}}</span>
          <span class="single-price {{single_hidden}}">{{price}}</span>
        </div>
      </div>
      <p class="d40-date">Kampanya 15.10.2026 tarihine<br />kadar geçerlidir.</p>
      <img class="d40-logo" src="{{logo_url}}" alt="VATKALI" />
    </section>
  </main>
</body>
</html>
