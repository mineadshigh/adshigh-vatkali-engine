<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame {{variant_class}}">
    <section class="new-season-design">
      <header class="new-header">
        <img class="new-logo" src="{{white_logo_url}}" alt="VATKALI" />
        <div class="attitude-name">THE ATTITUDE</div>
        <div class="attitude-season">26/27’FW</div>
      </header>

      <div class="new-image new-image-left">
        <img src="{{product_image_primary}}" alt="" />
      </div>
      <div class="new-image new-image-right">
        <img src="{{product_image_secondary_1}}" alt="" />
      </div>

      <footer class="new-footer">
        <div class="discount-mark"><span class="percent">%</span><span class="number">20</span></div>
        <div class="discount-word">İNDİRİM</div>
        <div class="new-price">{{campaign_price}}</div>
        <div class="app-label">UYGULAMAYA ÖZEL</div>
      </footer>
    </section>

    <section class="old-season-design">
      <img class="old-logo" src="{{white_logo_url}}" alt="VATKALI" />

      <div class="old-product-frame">
        <img class="product-image" src="{{product_image_primary}}" alt="" />
      </div>

      <div class="old-offer">
        <div class="offer-block offer-net"><span class="offer-label">NET</span><span class="offer-rate">%30</span></div>
        <div class="offer-divider"></div>
        <div class="offer-block offer-extra"><span class="offer-label">APP’E ÖZEL EKSTRA</span><span class="offer-rate">%20</span></div>
        <div class="offer-word">İNDİRİM</div>
      </div>

      <div class="old-product-info">
        <p class="old-product-title">{{title}}</p>
        <div class="old-prices">
          <span class="old-price">{{price}}</span>
          <span class="final-price">{{campaign_price}}</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
