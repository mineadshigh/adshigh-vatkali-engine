<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>{{CSS}}</style>
</head>
<body>
<main class="frame meta">
  <img class="brand" src="{{frame_logo}}" alt="VATKALI">

  <div class="psd-text discount" data-w="114" data-h="46">
    <span class="ink"><span class="run" style="font-weight:800">%40</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text net" data-w="40" data-h="17">
    <span class="ink"><span class="run" style="font-weight:500">NET</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text discount-word" data-w="78" data-h="22">
    <span class="ink"><span class="run" style="font-weight:500">İNDİRİM</span><i class="baseline"></i></span>
  </div>

  <img class="primary"
       src="{{product_image_primary}}" alt="">
  <img class="secondary"
       src="{{product_image_secondary_1}}" alt="">

  <div class="psd-text november" data-w="116" data-h="30">
    <span class="ink"><span class="run" style="font-weight:800">KASIM</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text november-word" data-w="226" data-h="38">
    <span class="ink"><span class="run" style="font-weight:800">İNDİRİMLERİ</span><i class="baseline"></i></span>
  </div>

  <section class="details">
    <div class="product-title"
         data-size="30.5065768640658"
         data-width="410"
         data-cap="34">{{title}}</div>

    <div class="price-row" data-maxwidth="410">
      <div {{old_hidden}}
           class="psd-text old-price"
           data-w="102"
           data-h="22"
           data-fit="natural"
           data-reference="1.990 TL"
           data-minwidth="105">
        <span class="ink"><span class="run" style="font-weight:500">{{price}}</span><i class="baseline"></i></span>
      </div>

      <div class="sale-box">
        <div class="psd-text sale-price"
             data-w="96"
             data-h="22"
             data-fit="natural"
             data-reference="1.194 TL">
          <span class="ink"><span class="run" style="font-weight:700">{{campaign_price}}</span><i class="baseline"></i></span>
        </div>
      </div>
    </div>
  </section>
</main>
{{FRAME_SCRIPT}}
</body>
</html>
