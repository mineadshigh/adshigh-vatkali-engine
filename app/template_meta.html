<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame">
    <img class="logo" src="{{logo_url}}" alt="VATKALI">

    <h1>SONBAHAR İNDİRİMİ</h1>

    <div class="offer">
      <div><b>%40’A VARAN</b> İNDİRİMLERE EK</div>
      <span>+%10 KUPON: <b>V10</b></span>
      <strong>KUPON FIRSATI</strong>
      <small>
        *Aksesuar kategorisi hariç tüm ürünlerde,<br>
        26.10.2026 saat 10.00’a kadar geçerlidir.
      </small>
    </div>

    <img class="primary"
         src="{{product_image_primary}}" alt="">
    <img class="secondary"
         src="{{product_image_secondary_1}}" alt="">

    <div class="details">
      <div class="title">{{title}}</div>
      <div class="prices">
        <del {{old_hidden}}>{{price}}</del>
        <b>{{campaign_price}}</b>
      </div>
    </div>
  </main>
</body>
</html>
