<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>{{CSS}}</style>
</head>
<body>
<main class="frame meta">
  <img class="primary" src="{{product_image_primary}}" alt="">
  <img class="brand" src="{{frame_logo}}" alt="VATKALI">

  <div class="campaign-bar"></div>
  <div class="special-bar"></div>

  <div class="psd-text discount" data-w="144" data-h="57">
    <span class="ink"><span class="run" style="font-weight:700">%40</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text discount-extra" data-w="213" data-h="35">
    <span class="ink"><span class="run" style="font-weight:700">İNDİRİME EK</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text extra-offer" data-w="386" data-h="39">
    <span class="ink"><span class="run" style="font-weight:300">SEPETTE </span><span class="run" style="font-weight:700">%11 İNDİRİM</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text special" data-w="191" data-h="35">
    <span class="ink"><span class="run" style="font-weight:700">11.11’E ÖZEL</span><i class="baseline"></i></span>
  </div>

  <section class="details">
    <div class="product-title"
         data-size="26.6601428422822"
         data-width="260">{{title}}</div>

    <div class="price-row" data-maxwidth="280">
      <div {{old_hidden}}
           class="psd-text old-price"
           data-w="97" data-h="19"
           data-fit="natural"
           data-reference="2.990 TL"
           data-minwidth="0">
        <span class="ink"><span class="run" style="font-weight:400">{{price}}</span><i class="baseline"></i></span>
      </div>

      <div class="psd-text sale-price"
           data-w="134" data-h="26"
           data-fit="natural"
           data-reference="2.392 TL">
        <span class="ink"><span class="run" style="font-weight:700">{{campaign_price}}</span><i class="baseline"></i></span>
      </div>
    </div>
  </section>
</main>
{{FRAME_SCRIPT}}
</body>
</html>
