<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame {{variant_class}}">
    <img class="logo" src="{{white_logo_url}}" alt="VATKALI" />

    <div class="product-frame product-frame-primary">
      <img src="{{product_image_primary}}" alt="" />
    </div>
    <div class="product-frame product-frame-secondary">
      <img src="{{product_image_secondary_1}}" alt="" />
    </div>

    <section class="campaign">
      <p class="campaign-kicker">Tüm ürünlerde geçerli</p>
      <div class="discount-row">
        <span class="discount-value">%40</span>
        <span class="discount-suffix">’a varan</span>
      </div>
      <p class="discount-label">İNDİRİM</p>
    </section>

    <section class="product-info">
      <p class="product-title">{{title}}</p>
      <div class="prices">
        <span class="old-price {{old_hidden}}">{{price}}</span>
        <span class="sale-price {{new_hidden}}">{{sale_price}}</span>
        <span class="single-price {{single_hidden}}">{{price}}</span>
      </div>
    </section>

    <p class="season">FALL WINTER ‘26/27</p>
  </main>
</body>
</html>
