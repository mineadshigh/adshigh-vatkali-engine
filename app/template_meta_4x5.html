<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame">
    <h1 class="campaign-title">SEZONUN SON İNDİRİMİ</h1>
    <p class="campaign-offer">SEPETTE EKSTRA NET <strong>%40 İNDİRİM</strong></p>

    <div class="product-frame">
      <img class="product-image" src="{{product_image_primary}}" alt="" />
    </div>

    <div class="product-info">
      <p class="product-title">{{title}}</p>
      <div class="prices">
        <span class="old-price {{old_hidden}}">{{price}}</span>
        <span class="sale-price {{new_hidden}}">{{sale_price}}</span>
        <span class="single-price {{single_hidden}}">{{price}}</span>
      </div>
    </div>

    <div class="campaign-logo"><img src="{{logo_url}}" alt="" /></div>
  </main>
</body>
</html>
