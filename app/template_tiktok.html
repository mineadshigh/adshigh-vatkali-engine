<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><style>{{CSS}}</style></head>
<body><main class="frame tiktok">
<img class="primary" src="{{product_image_primary}}" alt="">
<img class="brand" src="{{frame_logo}}" alt="VATKALI">
<div class="campaign-bar"></div>
<div class="special-bar"></div>
<div class="psd-text discount" data-w="144" data-h="57" ><span class="ink"><span class="run" style="font-weight:700">%40</span><i class="baseline"></i></span></div>
<div class="psd-text discount-extra" data-w="213" data-h="35" ><span class="ink"><span class="run" style="font-weight:700">İNDİRİME EK</span><i class="baseline"></i></span></div>
<div class="psd-text extra-offer" data-w="356" data-h="36" ><span class="ink"><span class="run" style="font-weight:300">SEPETTE </span><span class="run" style="font-weight:700">%11 İNDİRİM</span><i class="baseline"></i></span></div>
<div class="psd-text special" data-w="280" data-h="35"><span class="ink"><span class="run" style="font-weight:700">11.11 İNDİRİMLERİ</span><i class="baseline"></i></span></div>
<div class="psd-text special-continued" data-w="222" data-h="30"><span class="ink"><span class="run" style="font-weight:500">DEVAM EDİYOR</span><i class="baseline"></i></span></div>
<section class="details">
<div class="product-title" data-size="26.6601428422822" data-width="260">{{title}}</div>
<div class="price-row three-prices" data-maxwidth="260">
<del class="reference-amount" {{original_hidden}}>{{original_price}}</del>
<div class="markdown-amount" {{intermediate_hidden}}>%40&nbsp; {{price}}</div>
<div class="cart-amount"><span>{{cart_label}}</span><strong>{{campaign_price}}</strong></div>
</div>
</section>
</main>
{{FRAME_SCRIPT}}
</body></html>
