<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>{{CSS}}</style>
</head>
<body>
<main class="frame tiktok">
  <img class="brand" src="{{frame_logo}}" alt="VATKALI">

  <div class="psd-text discount" data-w="144" data-h="58">
    <span class="ink"><span class="run" style="font-weight:800">%40</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text net" data-w="184" data-h="31">
    <span class="ink"><span class="run" style="font-weight:900">NET İNDİRİM</span><i class="baseline"></i></span>
  </div>

  <div class="psd-text november" data-w="247" data-h="23">
    <span class="ink"><span class="run" style="font-weight:300">KASIM FIRSATLARI</span><i class="baseline"></i></span>
  </div>

  <img class="primary"
       src="{{product_image_primary}}" alt="">

  <section class="details">
    <div class="product-title"
         data-size="39.0348429108239"
         data-width="620"
         data-cap="43">{{title}}</div>

    <div class="price-row" data-maxwidth="299">
      <div {{old_hidden}}
           class="psd-text old-price"
           data-w="130"
           data-h="27"
           data-fit="natural"
           data-reference="1.990 TL"
           data-minwidth="134">
        <span class="ink"><span class="run" style="font-weight:500">{{price}}</span><i class="baseline"></i></span>
      </div>

      <div class="sale-box">
        <div class="psd-text sale-price"
             data-w="123"
             data-h="28"
             data-fit="natural"
             data-reference="1.194 TL">
          <span class="ink"><span class="run" style="font-weight:700">{{campaign_price}}</span><i class="baseline"></i></span>
        </div>
      </div>
    </div>
  </section>
</main>
{{FRAME_SCRIPT}}
</body>
</html>
