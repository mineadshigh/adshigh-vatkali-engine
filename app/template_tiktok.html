<!doctype html>
<html lang="tr">
<head>

  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame">
    <img class="logo" src="{{logo_url}}" alt="VATKALI">

    <div class="images">
      <img src="{{product_image_primary}}" alt="">
    </div>

    <div class="offer">
      <div>UYGULAMAYA ÖZEL</div>
      <span>SEPETTE <b>%20 İNDİRİM</b></span>

    <div class="details">

      <div class="prices">
        <del {{old_hidden}}>{{price}}</del>
        <b>{{campaign_price}}</b>
      </div>
    </div>

    <small>
      *Aksesuar koleksiyonu hariç tüm ürünlerde geçerlidir.
    </small>
  </main>

</html>
