<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame">
    <img class="logo" src="{{logo_url}}" alt="VATKALI" />
    <p class="offer-note">Tüm ürünlerde geçerli</p>
    <p class="opportunity">Tekrarı olmayan fırsatlar</p>
    <div class="offer">SEPETTE <strong>%40 İNDİRİM</strong></div>
    <section class="product-info">
      <p class="product-title">{{title}}</p>
      <div class="prices">
        <span class="old-price {{old_hidden}}">{{price}}</span>
        <span class="sale-price {{new_hidden}}">{{sale_price}}</span>
        <span class="single-price {{single_hidden}}">{{price}}</span>
      </div>
    </section>
    <div class="product-frame"><img src="{{product_image_primary}}" alt="" /></div>
  </main>
</body>
</html>
