<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <style>{{CSS}}</style>
</head>

<body>
  <div class="frame">

    <div class="headline">İNDİRİM</div>

    <div class="product-frame">
      <img
        class="product-image"
        src="{{product_image_primary}}"
        alt=""
      />
    </div>

    <div class="offers">

      <div class="offer offer-20">
        <div class="offer-label">2 ÜRÜN VE ÜZERİ</div>
        <div class="offer-rate">20%</div>
      </div>

      <div class="offer-divider"></div>

      <div class="offer offer-30">
        <div class="offer-label">3 ÜRÜN VE ÜZERİ</div>
        <div class="offer-rate">30%</div>
      </div>

    </div>

    <div class="coupon-message">
      <span>TÜM İNDİRİMLERE EK</span>
      <span class="coupon-percent">+%10</span>
      <span>İNDİRİM KUPONU</span>
    </div>

    <div class="coupon-code">JULY10</div>

  </div>
</body>
</html>
