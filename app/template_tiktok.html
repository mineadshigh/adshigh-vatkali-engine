<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>{{CSS}}</style>
</head>
<body>
  <main class="frame {{variant_class}}">
    <section class="best-seller-design">
      <img class="best-logo" src="{{logo_url}}" alt="VATKALI" />
      <div class="best-note">Tüm ürünlerde geçerli</div>
      <div class="best-offer">SEPETTE <strong>%10 İNDİRİM</strong></div>
      <div class="best-info">
        <p>{{title}}</p>
        <div class="prices"><span class="old-price {{old_hidden}}">{{price}}</span><span class="sale-price {{new_hidden}}">{{sale_price}}</span><span class="single-price {{single_hidden}}">{{price}}</span></div>
      </div>
      <div class="best-product-frame"><img src="{{product_image_primary}}" alt="" /></div>
    </section>

    <section class="new-season-design">
      <img class="new-logo" src="{{white_logo_url}}" alt="VATKALI" />
      <div class="new-note">Tüm ürünlerde geçerli</div>
      <div class="new-offer"><strong>%10</strong><span>İNDİRİM</span></div>
      <div class="new-product-frame"><img src="{{product_image_primary}}" alt="" /></div>
      <div class="new-info">
        <p>{{title}}</p>
        <div class="prices"><span class="old-price {{old_hidden}}">{{price}}</span><span class="sale-price {{new_hidden}}">{{sale_price}}</span><span class="single-price {{single_hidden}}">{{price}}</span></div>
      </div>
      <div class="attitude-name">THE ATTITUDE</div>
      <div class="attitude-season">26/27’FW</div>
    </section>
  </main>
</body>
</html>
