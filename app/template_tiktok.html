<script>
(async()=>{
  await document.fonts.ready;
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  const fontFor=(weight)=>`${weight} 100px Outfit, Lira, sans-serif`;
  function fitInk(el){
    const ink=el.querySelector('.ink'),runs=[...ink.querySelectorAll('.run')];
    let advance=0,min=Infinity,max=-Infinity,asc=0,desc=0;
    for(const run of runs){
      ctx.font=fontFor(getComputedStyle(run).fontWeight);
      const m=ctx.measureText(run.textContent);
      min=Math.min(min,advance-m.actualBoundingBoxLeft);
      max=Math.max(max,advance+m.actualBoundingBoxRight);
      asc=Math.max(asc,m.actualBoundingBoxAscent);desc=Math.max(desc,m.actualBoundingBoxDescent);
      advance+=m.width;
    }
    if(!Number.isFinite(min)||max<=min)return;
    const w=+el.dataset.w,h=+el.dataset.h;
    let sy=h/(asc+desc),sx=w/(max-min);
    if(el.dataset.fit==='natural'){
      sx=sy*(.95/.93);
      if((max-min)*sx>w){const ratio=w/((max-min)*sx);sx*=ratio;sy*=ratio;}
    }
    const baseline=ink.querySelector('.baseline').getBoundingClientRect().top-ink.getBoundingClientRect().top;
    const shift=el.dataset.align==='right'?w-(max-min)*sx:0;
    ink.style.transform=`matrix(${sx},0,0,${sy},${shift-min*sx},${-(baseline-asc)*sy})`;
    el.style.width=w+'px';el.style.height=h+'px';
    const strike=el.querySelector('.strike');
    if(strike){strike.style.left=shift+'px';strike.style.width=(max-min)*sx+'px';}
  }
  document.querySelectorAll('.psd-text').forEach(fitInk);
  function title(el){
    const raw=el.textContent.trim(),base=+el.dataset.size,sx=+el.dataset.sx,sy=+el.dataset.sy;
    const maxWidth=+el.dataset.width,maxHeight=200;
    function layout(size){
      const spacing=+el.dataset.tracking*size/1000;
      ctx.font=`300 ${size}px Outfit`;ctx.letterSpacing=spacing+'px';
      const width=t=>ctx.measureText(t).width*sx;
      const lines=[];let line='';
      for(const word of raw.split(/\s+/)){
        if(width(word)>maxWidth){
          if(line){lines.push(line);line='';}
          let part='';
          for(const ch of word){if(part&&width(part+ch)>maxWidth){lines.push(part);part=ch;}else part+=ch;}
          line=part;continue;
        }
        const candidate=line?line+' '+word:word;
        if(line&&width(candidate)>maxWidth){lines.push(line);line=word;}else line=candidate;
      }
      if(line)lines.push(line);
      const leading=+el.dataset.leading*size/base;
      return {lines,size,spacing,leading,height:lines.length?(lines.length-1)*leading+size*sy:0};
    }
    let result=layout(base);
    // Full text flows down in its own left column; price positions are untouched.
    // Only exceptionally long names shrink if they would reach the logo.
    for(let size=base-.25;result.height>maxHeight&&size>=4;size-=.25)result=layout(size);
    el.replaceChildren();el.style.height=result.height+'px';
    el.dataset.titleLines=result.lines.length;el.dataset.titleSize=result.size;
    result.lines.forEach((text,i)=>{
      const span=document.createElement('span');span.className='title-line';span.textContent=text;
      span.style.fontSize=result.size+'px';span.style.lineHeight=result.size+'px';span.style.letterSpacing=result.spacing+'px';
      span.style.top=i*result.leading+'px';span.style.transform=`scale(${sx},${sy})`;el.append(span);
    });
  }
  document.querySelectorAll('.product-title').forEach(title);
  await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
  document.documentElement.dataset.renderReady='true';
})().catch(e=>{document.documentElement.dataset.renderError=String(e);});
</script>
